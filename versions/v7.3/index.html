<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F8F4EC"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="亲智聊"><meta name="format-detection" content="telephone=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>亲智聊</title><style>
:root{
  --bg:#f7eee2;
  --bg-soft:#fffaf3;
  --surface:#fffdf9;
  --surface-2:#fff7ec;
  --surface-3:#f8f2e9;
  --text:#2f2924;
  --muted:#8f8378;
  --muted-2:#b3a79c;
  --line:#eadfd2;
  --line-soft:#f1e9df;
  --orange:#ff9347;
  --orange-2:#ffab67;
  --orange-soft:#fff0df;
  --green:#6da94f;
  --green-soft:#edf6e8;
  --blue:#5f88de;
  --blue-soft:#edf3ff;
  --violet:#8472cf;
  --violet-soft:#f1edff;
  --danger:#dd675a;
  --shadow-sm:0 7px 18px rgba(72,53,37,.055);

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
img{max-width:100%;display:block}
#app{width:100%;height:100%}
.app-frame{position:relative;width:min(100%,480px);height:100dvh;min-height:100vh;margin:0 auto;overflow:hidden;background:var(--surface);box-shadow:0 0 0 1px rgba(66,48,31,.025)}
.main-viewport{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--surface);will-change:transform;transform:translate3d(0,0,0);z-index:10;overflow:hidden}
.statusbar{height:calc(28px + var(--safe-top));padding:calc(6px + var(--safe-top)) 17px 0;display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:750;flex:0 0 auto;background:inherit;position:relative;z-index:30}
.status-icons{display:flex;gap:7px;align-items:center;font-size:11px;letter-spacing:.2px}
.screen-host{position:relative;flex:1;min-height:0;overflow:hidden;background:var(--surface)}
.screen{position:absolute;inset:0;overflow:hidden;background:var(--surface)}
.screen.page-enter-forward{animation:pageForward .28s cubic-bezier(.2,.78,.22,1)}

.scroll-page{position:absolute;inset:0;overflow:auto;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.scroll-page::-webkit-scrollbar{display:none}

/* Generic app chrome */

.icon-btn svg,.round-btn svg,.menu-btn svg,.back-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round}

.page-titlebar b{font-size:18px}

/* Buttons / cards */
.primary-btn,.secondary-btn,.ghost-btn,.danger-btn{height:50px;border-radius:25px;padding:0 18px;font-weight:850;border:0;transition:transform .08s ease,opacity .08s ease,background .16s ease}

/* Auth */

.auth-bubble.b1{left:15px;top:68px}.auth-bubble.b2{right:14px;top:105px}.auth-bubble.b3{left:27px;bottom:117px}.auth-bubble.b4{right:22px;bottom:86px}
.auth-actions{padding:0 22px calc(15px + var(--safe-bottom));flex:0 0 auto}

.agreement-row{display:flex;justify-content:center;align-items:flex-start;gap:8px;margin:12px 0 0;color:#94877d;font-size:11px;line-height:1.5}

.agreement-row a{color:#db7635;text-decoration:none}
.auth-sheet-screen{height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,#fff8f0,#fffdf9)}
.auth-visual{flex:1;min-height:235px;position:relative;padding:18px}

.auth-panel{background:#fffdf9;border-radius:28px 28px 0 0;padding:24px 20px calc(30px + var(--safe-bottom));box-shadow:0 -15px 38px rgba(75,56,39,.08);position:relative}

.resend-btn{height:42px;border:0;background:transparent;color:#998d82;font-weight:800}.resend-btn.ready{color:#dd7634}.resend-btn:disabled{opacity:1}
.provider-mark{width:52px;height:52px;border-radius:17px;background:#28b86b;color:#fff;display:grid;place-items:center;font-size:22px;font-weight:900;margin:0 auto 13px}

.doc-page{height:100%;overflow:auto;background:#fffdf9}.doc-body{padding:10px 20px 35px}.doc-body h1{font-size:22px;margin:14px 0}.doc-body h3{font-size:15px;margin:20px 0 7px}.doc-body p{font-size:13px;color:#6e635a;line-height:1.85;margin:0 0 9px}
.success-screen{height:100%;display:grid;place-items:center;background:linear-gradient(180deg,#fffaf2,#f8ecdc);text-align:center}.success-icon{width:82px;height:82px;border-radius:27px;background:var(--green-soft);display:grid;place-items:center;color:var(--green);font-size:40px;margin:0 auto}.success-screen h1{font-size:25px;margin:18px 0 5px}.spinner{width:26px;height:26px;border:3px solid #efdfcf;border-top-color:var(--orange);border-radius:50%;animation:spin .8s linear infinite;margin:18px auto}

/* First-use privacy modal */
.overlay{position:absolute;inset:0;background:rgba(51,45,40,.50);z-index:100;display:flex;align-items:center;justify-content:center;padding:28px;animation:fadeIn .16s ease}
.modal-card{width:100%;background:#fff;border-radius:25px;padding:22px;box-shadow:0 26px 70px rgba(0,0,0,.18)}

.modal-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-actions button{height:48px;border-radius:24px;font-weight:850}

/* Home / AI main */
.ai-shell{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 88% 12%,rgba(238,225,250,.30),transparent 27%),radial-gradient(circle at 8% 16%,rgba(255,211,181,.31),transparent 29%),linear-gradient(180deg,#fffaf4,#fffdf9 58%,#faf6ef)}
.ai-content{flex:1;min-height:0;overflow:auto;scrollbar-width:none;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding-bottom:10px}.ai-content::-webkit-scrollbar{display:none}
.home-hero{height:286px;position:relative;text-align:center;padding-top:28px}
.home-hero img{width:138px;height:138px;object-fit:contain;margin:39px auto 0;filter:drop-shadow(0 12px 18px rgba(89,113,68,.11))}
.home-hero h1{font-size:27px;margin:0 0 4px}.home-hero p{font-size:14px;font-weight:750;margin:0;color:#5b514a}
.float-prompt{position:absolute;border:1px solid #efddcb;background:rgba(255,255,255,.75);border-radius:18px;padding:8px 12px;font-size:12px;color:#776a60;box-shadow:var(--shadow-sm)}
.float-prompt.p1{left:17px;top:50px}.float-prompt.p2{right:15px;top:77px}.float-prompt.p3{left:28px;top:164px}.float-prompt.p4{right:20px;top:185px}
.growth-summary{padding:15px;text-align:left;width:100%}
.growth-row{display:flex;gap:12px;align-items:center}.growth-icon{width:50px;height:50px;border-radius:17px;background:var(--orange-soft);display:grid;place-items:center;font-size:23px}.growth-main{flex:1;min-width:0}.growth-main b{font-size:15px;display:block;margin-bottom:4px}.growth-main span{font-size:12px;color:var(--muted);line-height:1.5}.growth-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.growth-stat{background:#fbf6ef;border-radius:14px;padding:10px}.growth-stat small{display:block;font-size:10px;color:#998d82}.growth-stat strong{display:block;font-size:15px;margin-top:3px}
.prompt-list{display:grid;gap:10px}.prompt-card{width:100%;border:1px solid var(--line);border-radius:18px;background:rgba(255,255,255,.85);display:flex;align-items:center;gap:12px;padding:14px;text-align:left;box-shadow:0 6px 16px rgba(72,53,37,.035)}.prompt-icon{width:44px;height:44px;border-radius:15px;background:#faf2e9;display:grid;place-items:center;font-size:20px;flex:0 0 auto}.prompt-card b{display:block;font-size:14px;margin-bottom:4px}.prompt-card span{font-size:12px;color:var(--muted);line-height:1.45}.home-or{text-align:center;font-size:12px;color:#aa9e93;margin:14px 0 3px}
.composer{flex:0 0 auto;padding:8px 12px calc(10px + var(--safe-bottom));background:linear-gradient(180deg,rgba(255,253,249,0),rgba(255,253,249,.98) 24%)}
.composer-row{display:flex;align-items:flex-end;gap:8px}.composer-btn{width:44px;height:44px;border:1px solid #e7d9cc;border-radius:22px;background:#fff;display:grid;place-items:center;font-size:18px;flex:0 0 auto}.composer-btn svg{width:20px;height:20px;stroke:#5d534c;fill:none;stroke-width:1.8}.composer-input{min-height:48px;max-height:120px;flex:1;border:1px solid #e7d9cc;border-radius:24px;background:#fff;display:flex;align-items:center;padding:7px 14px}.composer-input textarea{width:100%;border:0;outline:0;resize:none;min-height:25px;max-height:92px;line-height:1.5;background:transparent;font-size:14px;padding:2px 0}.composer-btn.send-ready{background:var(--orange);border-color:var(--orange);color:#fff}.composer-btn.send-ready svg{stroke:#fff}

/* Chat */
.chat-area{padding:4px 15px 12px}.chat-date{text-align:center;color:#aaa096;font-size:10px;margin:8px 0}.chat-message{max-width:84%;border-radius:18px;padding:11px 13px;margin:10px 0;font-size:14px;line-height:1.62;animation:messageIn .18s ease}.chat-message.ai{background:#fff;border:1px solid #e9ddcf;border-top-left-radius:7px}.chat-message.user{background:#ffe9d4;margin-left:auto;border-top-right-radius:7px}.chat-message.system{max-width:100%;background:transparent;padding:0;margin:10px 0}.chat-message small{display:block;color:#aaa096;font-size:10px;margin-top:5px}
@keyframes messageIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.typing{display:flex;gap:4px;align-items:center;height:19px}.typing i{width:5px;height:5px;border-radius:50%;background:#9d9187;animation:dot 1.2s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes dot{0%,60%,100%{opacity:.35;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}.choice-chip{border:1px solid #eadbcc;background:#fff;border-radius:18px;padding:8px 11px;color:#6f6359;font-size:12px}.choice-chip:active{background:var(--orange-soft);border-color:#f1c69f}
.invite-card,.interpretation-card,.action-card{background:#fff;border:1px solid #eadccd;border-radius:20px;padding:14px;margin:12px 0;box-shadow:var(--shadow-sm)}
.invite-card h3,.interpretation-card h3,.action-card h3{font-size:15px;margin:0 0 7px}.invite-card p,.interpretation-card p,.action-card p{font-size:12px;color:#72675e;line-height:1.67;margin:0 0 12px}.inline-actions{display:flex;gap:8px;flex-wrap:wrap}.inline-actions button{min-height:40px;border-radius:14px;padding:0 13px;font-size:12px;font-weight:850}.inline-main{border:0;background:linear-gradient(90deg,var(--orange),var(--orange-2));color:#fff}.inline-alt{border:1px solid #e7d7c7;background:#fff;color:#776a60}
.interpretation-card{background:#fff8ef;border-color:#efdcc7}.interpret-title{font-size:14px;font-weight:900}.progress-rail{height:6px;background:#efe7de;border-radius:99px;margin:12px 0 7px;overflow:hidden}.progress-rail i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--orange-2));transform-origin:left;transition:transform .28s ease;border-radius:99px}.progress-labels{display:flex;justify-content:space-between;color:#b0a59b;font-size:10px}.progress-labels span.current{color:#5a4e44;font-weight:900}.understanding-box{background:#fff;border-radius:15px;padding:12px;margin:12px 0;font-size:12px;line-height:1.72;color:#61574f}.final-understanding{background:linear-gradient(135deg,#fff7e9,#f6f1e9);border-radius:16px;padding:13px;margin:10px 0;font-size:12px;line-height:1.75;color:#5d534b}.action-card{background:linear-gradient(135deg,#fff8ed,#f2f7ec)}.phrase-box{background:#fff;border-radius:14px;padding:11px;margin:9px 0;font-size:12px;line-height:1.6;color:#5f574f}.boundary-note{font-size:10px;color:#a1958a;margin-top:10px;line-height:1.5}.back-to-latest{position:absolute;right:16px;bottom:78px;height:34px;border:1px solid #e4d7ca;border-radius:17px;background:#fff;padding:0 11px;font-size:11px;color:#7f7368;box-shadow:var(--shadow-sm)}

  --warm-soft:#F3E5CA;
  --blue:#7186D7;
  --blue-soft:#ECF0FB;
  --violet:#9B88C7;
  --violet-soft:#F2EEFA;
  --danger:#D66A5D;
  --shadow-sm:0 8px 24px rgba(61,70,54,.055);
  --shadow-md:0 18px 44px rgba(56,68,50,.095);
  --radius-sm:14px;
  --radius-md:20px;
  --radius-lg:26px;
}
html,body{
  background:#EEE9E0;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Noto Sans CJK SC","Microsoft YaHei",system-ui,sans-serif;
  font-weight:400;
}
button,a{touch-action:manipulation}
.app-frame{
  background:var(--surface);
  box-shadow:0 26px 76px rgba(46,55,42,.13);
}
.main-viewport{
  background:var(--surface);
  transform-origin:center right;
  transition:none; /* Drawer transitions are enabled only by .animating. */
}
.main-viewport:after{
  content:"";position:absolute;inset:0;z-index:999;pointer-events:none;opacity:.017;
  background-image:url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxODAiIGhlaWdodD0iMTgwIiB2aWV3Qm94PSIwIDAgMTgwIDE4MCI+PGZpbHRlciBpZD0ibiI+PGZlVHVyYnVsZW5jZSB0eXBlPSJmcmFjdGFsTm9pc2UiIGJhc2VGcmVxdWVuY3k9Ii43NSIgbnVtT2N0YXZlcz0iMiIgc3RpdGNoVGlsZXM9InN0aXRjaCIvPjwvZmlsdGVyPjxyZWN0IHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiIGZpbHRlcj0idXJsKCNuKSIgb3BhY2l0eT0iLjE0Ii8+PC9zdmc+');mix-blend-mode:multiply;
}
.statusbar{
  background:rgba(253,252,249,.86);
  backdrop-filter:blur(15px);
  color:#252A23;
  font-weight:650;
  letter-spacing:.1px;
}
.status-icons{font-weight:650}
.screen-host,.screen{background:var(--surface)}
.topbar{
  height:58px;
  padding:0 12px;
  gap:7px;
  border-bottom:1px solid rgba(72,83,65,.07);
  background:rgba(253,252,249,.83);
  backdrop-filter:blur(18px) saturate(1.1);
}
.icon-btn,.round-btn,.menu-btn,.back-btn{
  width:40px;height:40px;border-radius:20px;color:#31392E;
  transition:transform .1s ease,background .16s ease,box-shadow .16s ease;
}
.icon-btn,.round-btn{background:rgba(255,255,255,.72);box-shadow:inset 0 0 0 1px rgba(70,82,63,.07),0 5px 15px rgba(54,68,48,.045)}
.icon-btn:active,.round-btn:active,.menu-btn:active,.back-btn:active{transform:scale(.965);background:rgba(237,244,232,.92)}
.icon-btn svg,.round-btn svg,.menu-btn svg,.back-btn svg{width:20px;height:20px;stroke-width:1.75}
.badge{
  position:absolute;right:-1px;top:-2px;transform:none!important;
  min-width:17px;height:17px;background:#F08A54;border:2px solid #fff;font-size:9px;
}
.v3-home-topbar{padding-left:9px}
.v3-top-brand{display:flex;align-items:center;gap:8px;margin-right:auto;min-width:0}
.v3-top-brand img{width:35px;height:35px;border-radius:12px;box-shadow:0 5px 14px rgba(86,117,64,.12)}
.v3-top-brand span{display:flex;flex-direction:column;min-width:0;line-height:1.05}
.v3-top-brand b{font-size:16px;font-weight:700;letter-spacing:-.3px;color:#2F382D}
.v3-top-brand small{font-size:9px;color:#8D9588;margin-top:4px;white-space:nowrap}
.v3-chat-topbar{justify-content:space-between}
.v3-chat-title{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;line-height:1.15}
.v3-chat-title b{font-size:16px;font-weight:700;color:#30372E}
.v3-chat-title small{font-size:9px;color:#939A91;margin-top:4px;white-space:nowrap}
.v3-chat-topbar .round-btn:first-of-type{margin-left:auto}

/* Global premium controls */
.primary-btn,.secondary-btn,.ghost-btn,.danger-btn{
  height:50px;border-radius:25px;font-weight:650;letter-spacing:.05px;
}
.primary-btn{
  background:linear-gradient(135deg,#7CAF63 0%,#65964E 100%);
  box-shadow:0 10px 24px rgba(91,139,72,.22),inset 0 1px 0 rgba(255,255,255,.32);
}
.secondary-btn{background:rgba(255,255,255,.83);border:1px solid rgba(91,119,79,.12);color:#52634B;box-shadow:0 5px 16px rgba(55,70,49,.045)}
.ghost-btn{color:#747B70;font-weight:550}
.text-btn,.agreement-row a{color:var(--green-strong)}
.check-box{border-color:#A8ADA4;border-radius:5px}
.check-box:checked{background:var(--green);border-color:var(--green)}
.card,.panel,.page-card{
  background:rgba(255,255,255,.79);
  border:1px solid rgba(70,84,62,.075);
  border-radius:24px;
  box-shadow:0 12px 34px rgba(57,70,51,.065),inset 0 1px 0 rgba(255,255,255,.82);
  backdrop-filter:blur(12px);
}
.section-title{font-size:17px;font-weight:650;color:#30372E;margin:16px 0 11px}
.section-title button{color:#8A9187;font-size:11px;font-weight:500}
.subtle{color:var(--muted);font-size:12px;line-height:1.65}
.page-titlebar{height:58px;background:rgba(253,252,249,.9);border-bottom:1px solid rgba(73,83,67,.07);backdrop-filter:blur(16px)}
.page-titlebar b{font-size:19px;font-weight:700;letter-spacing:-.25px;color:#2E352C}
.page-titlebar .back-btn{left:4px;width:48px;height:48px}
.page-titlebar .right-action{right:14px;color:var(--green-strong);font-weight:600}
.secondary-page{background:linear-gradient(160deg,#F8F4EC 0%,#F2F5ED 70%,#F8F4EE 100%)}
.page-body{padding:15px 15px calc(28px + var(--safe-bottom))}

/* Login — editorial brand scene */

  overflow:hidden;
  background:#F9F4EC;
}

.v3-login-brand{
  position:relative;z-index:3;height:62px;padding:7px 18px 0;display:flex;align-items:center;justify-content:space-between;
}
.v3-brand-lockup{display:flex;align-items:center;gap:10px}
.v3-brand-lockup>img{width:39px;height:39px;border-radius:14px;box-shadow:0 7px 17px rgba(75,111,59,.14)}
.v3-brand-lockup>span{display:flex;flex-direction:column;line-height:1.05}
.v3-brand-lockup b{font-size:19px;font-weight:700;color:#263226;letter-spacing:-.4px}
.v3-brand-lockup small{font-size:10px;color:#899283;margin-top:5px}
.v3-login-brand .support-btn{background:rgba(255,255,255,.65);border:1px solid rgba(74,91,65,.07);box-shadow:0 7px 18px rgba(57,70,50,.05)}
.v3-login-story{
  position:relative;z-index:2;flex:1;min-height:0;padding:18px 25px 0;display:flex;flex-direction:column;align-items:flex-start;
}
.v3-login-title-art{width:min(92%,375px);height:auto;object-fit:contain;margin:5px 0 2px -4px;filter:drop-shadow(0 5px 8px rgba(75,60,39,.035))}
.v3-login-story>p{font-size:13px;line-height:1.65;color:#697366;margin:0 0 2px 7px;font-weight:450}
.v3-login-scene{position:absolute;left:0;right:0;bottom:0;height:49%;min-height:245px;overflow:hidden}
.v3-login-scene-bg{position:absolute;inset:-15% -8% -12%;width:116%;height:127%;object-fit:cover;opacity:.42;mix-blend-mode:multiply}
.v3-login-mascot{position:absolute;width:clamp(175px,48vw,225px);height:auto;right:7%;bottom:-10px;filter:drop-shadow(0 16px 22px rgba(77,106,60,.16));animation:v3MascotBreathe 3.8s ease-in-out infinite}
.v3-value-pill{
  position:absolute;z-index:2;border:1px solid rgba(77,100,69,.09);background:rgba(255,253,248,.82);backdrop-filter:blur(12px);box-shadow:0 10px 22px rgba(55,68,50,.07);border-radius:999px;padding:9px 14px;color:#66705F;font-size:11px;font-weight:500;
}
.v3-value-pill.p1{left:20px;bottom:84px;transform:rotate(-4deg)}
.v3-value-pill.p2{right:22px;bottom:132px;transform:rotate(3deg)}
.v3-value-pill.p3{left:52px;bottom:21px;transform:rotate(1deg)}
.v3-login-actions{
  position:relative;z-index:4;padding:8px 22px calc(13px + var(--safe-bottom));
  background:linear-gradient(180deg,rgba(249,244,236,0),rgba(249,244,236,.9) 12%,#F9F4EC 34%);
}
.v3-login-actions .primary-btn{height:52px}
.v3-login-actions .secondary-btn{height:49px;margin-top:10px}
.v3-login-actions .agreement-row{margin-top:10px}
.v3-login-actions .ghost-btn{height:36px;margin-top:0}
@keyframes v3MascotBreathe{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-4px) rotate(.5deg)}}

/* Home — 2.5D scene */
.ai-shell{background:linear-gradient(160deg,#F9F4EB 0%,#F0F4E9 58%,#F8F3EB 100%)}
.ai-content{background:transparent}
.v3-home-idle{padding-bottom:4px}
.v3-home-stage{
  position:relative;height:334px;overflow:hidden;background:#F7F0E3;border-bottom:1px solid rgba(81,92,73,.05);
}
.v3-home-stage-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.98}
.v3-home-copy{position:absolute;z-index:3;left:28px;top:51px;text-align:left}
.v3-home-copy h1{margin:0;font-size:27px;line-height:1.2;font-weight:700;letter-spacing:-.65px;color:#2C332B}
.v3-home-copy p{margin:7px 0 0;color:#697466;font-size:13px;font-weight:450}
.v3-home-mascot{position:absolute;z-index:2;width:270px;right:-5px;bottom:28px;filter:drop-shadow(0 14px 20px rgba(61,87,49,.11));animation:v3HomeFloat 4.2s ease-in-out infinite}
@keyframes v3HomeFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.v3-home-prompts{position:absolute;left:20px;right:20px;bottom:16px;z-index:4;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.v3-home-chip{
  height:39px;border:1px solid rgba(81,95,72,.09);border-radius:20px;background:rgba(255,253,248,.84);backdrop-filter:blur(13px);display:flex;align-items:center;gap:7px;padding:0 12px;justify-content:flex-start;color:#5D6758;font-size:11px;font-weight:520;box-shadow:0 8px 20px rgba(56,70,50,.055);white-space:nowrap;
}
.v3-home-chip span{width:20px;height:20px;border-radius:7px;display:grid;place-items:center;color:var(--green);background:var(--green-soft)}
.v3-home-chip:nth-child(2) span{color:#D07F52;background:#FAE8DC}
.v3-home-chip:nth-child(3) span{color:#6D86C9;background:#EAF0FA}
.v3-home-chip:nth-child(4) span{color:#7C9B55;background:#EAF2DD}
.v3-home-chip svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.v3-home-chip:active{transform:scale(.98);background:#fff}
.v3-home-content{padding-top:5px}
.v3-growth-summary{
  position:relative;padding:18px 17px 15px;overflow:hidden;background:linear-gradient(145deg,rgba(255,255,255,.88),rgba(232,242,225,.84));border-color:rgba(94,133,76,.1);box-shadow:0 16px 36px rgba(55,77,49,.085),inset 0 1px 0 rgba(255,255,255,.85);
}
.v3-growth-summary:before{content:"";position:absolute;width:130px;height:130px;border-radius:50%;right:-38px;top:-52px;background:rgba(171,202,147,.18)}
.v3-growth-deco{position:absolute;right:22px;top:18px;width:45px;height:45px;border-radius:16px;background:rgba(255,255,255,.62);display:grid;place-items:center;color:#7AA65E;transform:rotate(5deg)}
.v3-growth-deco svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.v3-growth-summary .growth-icon{background:rgba(255,255,255,.72);color:#719D58;box-shadow:0 7px 16px rgba(66,89,57,.06)}
.v3-growth-summary .growth-main b{font-size:15px;font-weight:650;max-width:230px;color:#313A2F}
.v3-growth-summary .growth-main>span:not(.card-kicker){font-size:11px;color:#778173}
.v3-growth-summary .growth-stats{margin-top:14px}
.v3-growth-summary .growth-stat{background:rgba(255,255,255,.66);border:1px solid rgba(74,94,66,.055)}
.v3-question-section{padding-bottom:18px}
.v3-question-list{background:rgba(255,255,255,.74);border:1px solid rgba(74,86,67,.065);border-radius:22px;padding:3px 14px;box-shadow:0 11px 28px rgba(54,68,49,.055);backdrop-filter:blur(12px)}
.v3-question-list>button{width:100%;min-height:66px;border:0;border-bottom:1px solid rgba(74,86,67,.055);background:transparent;display:flex;align-items:center;gap:12px;text-align:left;padding:8px 0}
.v3-question-list>button:last-child{border-bottom:0}
.v3-question-icon{width:38px;height:38px;border-radius:13px;background:#EEF4E9;color:#719D58;display:grid;place-items:center;flex:0 0 auto}
.v3-question-icon.blue{background:#EDF1FA;color:#7186D7}.v3-question-icon.peach{background:#FAEDE2;color:#D78659}
.v3-question-icon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.v3-question-list>button>span:nth-child(2){flex:1;display:flex;flex-direction:column;gap:4px}
.v3-question-list b{font-size:14px;font-weight:600;color:#333A31}
.v3-question-list small{font-size:11px;color:#8A9287}
.v3-question-list i{width:22px;color:#ABB1A8;transform:rotate(180deg)}
.v3-question-list i svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.6}
.home-or{color:#9BA198;font-size:11px;margin:12px 0 0}

/* Composer — floating dock */
.composer{padding:7px 10px calc(9px + var(--safe-bottom));background:linear-gradient(180deg,rgba(248,245,238,0),rgba(248,245,238,.9) 26%,rgba(248,245,238,.98));}
.composer-row{
  min-height:54px;align-items:center;padding:5px 6px;border-radius:28px;background:rgba(255,255,255,.86);border:1px solid rgba(71,84,64,.085);box-shadow:0 12px 30px rgba(53,68,48,.11),inset 0 1px 0 rgba(255,255,255,.85);backdrop-filter:blur(18px);
}
.composer-btn{width:42px;height:42px;border-radius:21px;border:0;background:transparent;color:#61705D}
.composer-btn:hover{background:rgba(237,244,232,.7)}
.composer-input{border:0;background:transparent;padding:0 3px;min-height:42px}
.composer-input textarea{font-size:13px;color:#3A4237;padding:11px 0}
.composer-input textarea::placeholder{color:#A1A79E}
#chatSendBtn{background:linear-gradient(135deg,#7BB060,#65984C);color:#fff;box-shadow:0 6px 15px rgba(86,135,66,.23)}
#chatSendBtn:not(.send-ready){background:#EEF2EA;color:#9AA298;box-shadow:none}

/* Chat — calm, editorial hierarchy */
.chat-area{padding:10px 12px 18px;background:radial-gradient(circle at 100% 0,rgba(184,211,168,.18),transparent 31%),linear-gradient(180deg,#F8F4EC 0%,#F2F5ED 70%,#F8F4ED 100%)}
.chat-date{font-size:10px;color:#A5AAA2;margin:3px 0 14px}
.message-line{display:flex;align-items:flex-end;gap:7px;margin:10px 0}
.message-line.user{justify-content:flex-end}
.ai-avatar{width:31px;height:31px;border-radius:12px;background:rgba(234,243,228,.9);border:1px solid rgba(91,134,73,.09);box-shadow:0 5px 14px rgba(67,87,58,.07);overflow:hidden;flex:0 0 auto;display:grid;place-items:center}
.ai-avatar img{width:34px;height:35px;object-fit:contain;transform:translateY(2px)}
.message-stack{max-width:84%}
.chat-message{max-width:100%;padding:12px 14px;border-radius:18px;font-size:13px;line-height:1.7;box-shadow:none}
.chat-message.ai{background:rgba(255,255,255,.83);border:1px solid rgba(77,91,69,.065);border-top-left-radius:7px;color:#394137;box-shadow:0 9px 24px rgba(53,67,49,.05)}
.chat-message.user{background:linear-gradient(145deg,#E4F0DB,#D7E8CC);border:1px solid rgba(91,138,71,.09);border-top-right-radius:7px;color:#33412F;box-shadow:0 7px 20px rgba(79,115,64,.055)}
.message-tools{padding-left:5px;margin-top:4px}
.message-tools button{color:#A0A79D}
.chip-row{gap:7px;margin:8px 0 15px;padding-left:38px}
.choice-chip{background:rgba(255,255,255,.81);border-color:rgba(76,91,68,.085);color:#5B6657;font-size:11px;font-weight:500;box-shadow:0 6px 16px rgba(53,67,49,.035)}
.choice-chip:active{background:#EAF2E5;border-color:rgba(91,139,72,.22)}
.boundary-note{color:#9CA29A;font-size:9px;line-height:1.5;padding:5px 38px 0}
.invite-card,.interpretation-card,.action-card{
  margin-left:38px;margin-right:0;border:1px solid rgba(76,91,67,.075);border-radius:23px;background:rgba(255,255,255,.82);box-shadow:0 14px 34px rgba(54,69,49,.065),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(15px);
}
.invite-card{padding:17px}
.invite-card h3{font-size:15px;font-weight:650;color:#30382E;margin:9px 0 7px}.invite-card p{font-size:12px;color:#737C70;line-height:1.7}

/* =========================================================
   V3.2 — hard-pinned viewport + no side-reveal transition
   - Pin the H5 root to the visual viewport.
   - Never center or max-width the app frame.
   - Page transitions only fade; they never translate on X,
     so the host background cannot appear as a side strip.
   ========================================================= */
html,
body {
  width: 100%;
  height: 100%;
  min-width: 100%;
  min-height: 100%;
  max-width: none;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: var(--surface);
}

body {
  position: fixed;
  inset: 0;
}

#app {
  position: fixed;
  inset: 0;
  width: 100vw;
  width: 100dvw;
  height: 100vh;
  height: 100dvh;
  min-width: 0;
  max-width: none;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: var(--surface);
}

.app-frame {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  max-width: none;
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  box-shadow: none !important;
  overflow: hidden;
  background: var(--surface);
}

.main-viewport,
.screen-host,
.screen {
  left: 0;
  right: 0;
  width: 100%;
  max-width: none;
}

/* No horizontal movement at any point in a page transition. */
.screen.page-enter-forward,
.screen.page-enter-back {
  transform: none !important;
}

@media (min-width: 481px) {
  html,
  body,
  #app,
  .app-frame {
    width: 100%;
    max-width: none;
    margin: 0;
    background: var(--surface);
    box-shadow: none !important;
  }
}

.page-stack{
  position:absolute;
  left:0;right:0;
  top:calc(28px + var(--safe-top));
  bottom:0;
  z-index:85;
  pointer-events:none;
  overflow:hidden;
}
.page-stack:empty{display:none}
.stack-screen{
  position:absolute;
  inset:0;
  overflow:hidden;
  pointer-events:auto;
  background:var(--surface);
  transform:translate3d(0,0,0);
  will-change:transform,opacity;
}
.stack-screen.stack-enter{animation:v39StackIn .24s cubic-bezier(.22,.82,.22,1) both}
.stack-screen.stack-leave{animation:v39StackOut .22s cubic-bezier(.4,0,.2,1) both;pointer-events:none}
@keyframes v39StackIn{from{transform:translate3d(100%,0,0);opacity:.96}to{transform:translate3d(0,0,0);opacity:1}}
@keyframes v39StackOut{from{transform:translate3d(0,0,0);opacity:1}to{transform:translate3d(100%,0,0);opacity:.98}}

/* The secondary page fully owns horizontal gestures while it is visible. */
.page-stack:not(:empty)~.edge-handle{pointer-events:none!important}

/* ======================================================================
   亲智聊 Design System 4.0 · Warm Botanical Semantic Color
   目标：保留暖植品牌底盘，通过低饱和语义色建立“理解 / 家长 / 关系 / 行动 / 成长 / 测评”的视觉身份。
   ====================================================================== */
:root{
  /* neutral */
  --q4-canvas:#F3EEE6;
  --q4-surface:#FCFAF6;
  --q4-surface-2:#F7F3ED;
  --q4-text:#30362D;
  --q4-text-2:#687064;
  --q4-text-3:#9A9F96;
  --q4-divider:#E7E3DC;

  /* brand / growth */
  --q4-green-600:#5E8F4B;
  --q4-green-500:#77A762;
  --q4-green-300:#A8C598;
  --q4-green-100:#E4EFE0;
  --q4-green-050:#F2F7EF;

  /* parent / emotion / action */
  --q4-peach-600:#D88652;
  --q4-peach-500:#E7A06E;
  --q4-peach-300:#F0C5A4;
  --q4-peach-100:#FBE9DB;
  --q4-peach-050:#FFF4EC;

  /* observation / assessment */
  --q4-blue-600:#627FC2;
  --q4-blue-500:#8097CF;
  --q4-blue-300:#BBC7E5;
  --q4-blue-100:#EBEFF8;
  --q4-blue-050:#F4F6FB;

  /* relation / pattern */
  --q4-violet-600:#8074B2;
  --q4-violet-500:#9D94C8;
  --q4-violet-300:#CAC5E1;
  --q4-violet-100:#F0EDF7;
  --q4-violet-050:#F8F6FC;

  /* warm insight / plan */
  --q4-cream-600:#AF945E;
  --q4-cream-500:#D4BD86;
  --q4-cream-300:#EAD9AF;
  --q4-cream-100:#F8EFD9;
  --q4-cream-050:#FCF8EF;

  /* semantic aliases */
  --semantic-observation:var(--q4-blue-600);
  --semantic-observation-soft:var(--q4-blue-050);
  --semantic-child:var(--q4-green-600);
  --semantic-child-soft:var(--q4-green-050);
  --semantic-parent:var(--q4-peach-600);
  --semantic-parent-soft:var(--q4-peach-050);
  --semantic-relation:var(--q4-violet-600);
  --semantic-relation-soft:var(--q4-violet-050);
  --semantic-action:var(--q4-peach-600);
  --semantic-action-soft:var(--q4-cream-050);
  --semantic-growth:var(--q4-green-600);
  --semantic-growth-soft:var(--q4-green-050);
  --semantic-assessment:var(--q4-blue-600);
  --semantic-assessment-soft:var(--q4-blue-050);
}

}
.progress-rail{background:#ECEAE6}
.progress-rail i{background:linear-gradient(90deg,var(--q4-blue-500) 0 33%,var(--q4-violet-500) 66%,var(--q4-green-500) 100%)}
.progress-labels span.current{color:var(--q4-violet-600)}

.final-understanding{background:transparent;padding:0;margin-top:12px}
.final-title{
  background:linear-gradient(135deg,var(--q4-cream-050),#FFFDF8);
  border:1px solid rgba(175,148,94,.10);
  border-radius:15px;
  padding:11px 12px;
  margin-bottom:9px;
}
.final-title span{color:#A08452}

.final-understanding>.insight-section{
  position:relative;
  overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.62);
}
.final-understanding>.insight-section:before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:3px;
}
.final-understanding>.event-tone{
  background:var(--q4-blue-050);
  border-color:rgba(98,127,194,.10);
}
.final-understanding>.event-tone:before{background:var(--q4-blue-500)}
.final-understanding>.event-tone small{color:var(--q4-blue-600)}

.final-understanding>.child-tone{
  background:var(--q4-green-050);
  border-color:rgba(94,143,75,.10);
}
.final-understanding>.child-tone:before{background:var(--q4-green-500)}
.final-understanding>.child-tone small{color:var(--q4-green-600)}

.final-understanding>.parent-tone{
  background:var(--q4-peach-050);
  border-color:rgba(216,134,82,.10);
}
.final-understanding>.parent-tone:before{background:var(--q4-peach-500)}
.final-understanding>.parent-tone small{color:var(--q4-peach-600)}

.relationship-loop{
  background:var(--q4-violet-050)!important;
  border:1px solid rgba(128,116,178,.10);
  color:#6F659A!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.58);
}
.relationship-loop span{background:rgba(255,255,255,.72)!important;color:#6A608F}
.relationship-loop i{color:#A69CC6!important}
.insight-conclusion{
  background:linear-gradient(135deg,var(--q4-green-050),var(--q4-cream-050));
  border:1px solid rgba(94,143,75,.10);
  color:#465541;
}

/* ---------- Action card: visually distinct from interpretation ---------- */
.action-card{
  background:
    radial-gradient(circle at 92% 8%,rgba(231,160,110,.13),transparent 28%),
    linear-gradient(150deg,#FEF9EF 0%,#FCF6EA 62%,#F4F8F0 100%)!important;
  border-color:rgba(175,148,94,.12)!important;
  box-shadow:0 16px 36px rgba(86,73,46,.065)!important;
}
.action-mark{
  background:linear-gradient(145deg,var(--q4-peach-100),#F7E5D7)!important;
  color:var(--q4-peach-600)!important;
}
.action-head small{color:#A27B59!important}
.action-head h3{color:#4A3F32!important}
.phrase-box{
  background:rgba(255,255,255,.82)!important;
  border:1px solid rgba(175,148,94,.09);
  box-shadow:0 5px 16px rgba(90,72,45,.035);
}
.quote-label{color:var(--q4-peach-600)!important}
.action-reason{
  background:var(--q4-green-050)!important;
  border:1px solid rgba(94,143,75,.07);
}
.action-reason>span{color:var(--q4-green-600)!important}
.action-buttons .inline-main{background:linear-gradient(135deg,#E59A63,#CF7D49)!important;box-shadow:0 8px 17px rgba(216,134,82,.17)}

/* ---------- Growth: multi-semantic data, still green-dominant ---------- */
.growth-page{
  background:
    radial-gradient(circle at 92% 0%,rgba(168,197,152,.14),transparent 25%),
    radial-gradient(circle at 4% 24%,rgba(234,217,175,.10),transparent 23%),
    linear-gradient(180deg,#F8F6F1 0%,#F4F3EF 100%);
}
.growth-hero-card{
  background:
    radial-gradient(circle at 91% 9%,rgba(234,217,175,.20),transparent 29%),
    linear-gradient(145deg,#FFFDF8,#EFF6EB)!important;
}
.growth-hero-card .metric:nth-child(1){background:var(--q4-blue-050);border-color:rgba(98,127,194,.08)}
.growth-hero-card .metric:nth-child(1) strong{color:var(--q4-blue-600)}
.growth-hero-card .metric:nth-child(2){background:var(--q4-peach-050);border-color:rgba(216,134,82,.08)}
.growth-hero-card .metric:nth-child(2) strong{color:var(--q4-peach-600)}
.growth-hero-card .metric:nth-child(3){background:var(--q4-green-050);border-color:rgba(94,143,75,.08)}
.growth-hero-card .metric:nth-child(3) strong{color:var(--q4-green-600)}
.growth-hero-card .metric:nth-child(4){background:var(--q4-cream-050);border-color:rgba(175,148,94,.08)}
.growth-hero-card .metric:nth-child(4) strong{color:#927A49}

.growth-page .day.status-pending .day-status,.growth-page .legend-item.status-pending{color:var(--q4-peach-600)}
.growth-page .day.status-better .day-status,.growth-page .legend-item.status-better{color:var(--q4-green-600)}
.growth-page .day.status-same .day-status,.growth-page .legend-item.status-same{color:#7889A5}
.growth-page .day.status-worse .day-status,.growth-page .legend-item.status-worse{color:#C06F5A}
.growth-page .day.selected{background:var(--q4-cream-100)!important;box-shadow:inset 0 0 0 1px rgba(175,148,94,.10)}
.growth-page .latest-action{
  background:linear-gradient(145deg,var(--q4-cream-050),#FFFDF9);
  border-color:rgba(175,148,94,.10);
}
.growth-page .latest-action-title>span{background:var(--q4-peach-100);color:var(--q4-peach-600)}

/* ---------- Assessment: own professional blue identity ---------- */
.assessment-page{
  background:
    radial-gradient(circle at 90% 3%,rgba(187,199,229,.24),transparent 28%),
    linear-gradient(180deg,#F7F8FB 0%,#F5F3EF 100%);
}
.assessment-page .page-titlebar{background:rgba(249,250,252,.92)}
.assessment-card{
  background:linear-gradient(145deg,rgba(255,255,255,.88),rgba(244,246,251,.90));
  border-color:rgba(98,127,194,.09);
}
.assessment-icon{
  background:var(--q4-blue-100)!important;
  color:var(--q4-blue-600)!important;
}
.assessment-card .tag{background:#F1F3F8;color:#69758B}
.assessment-card .progress-bar{background:#E8EBF2}
.assessment-card .progress-bar i{background:linear-gradient(90deg,var(--q4-blue-500),var(--q4-blue-600))}
.assessment-card .small-cta{
  background:var(--q4-blue-100)!important;
  color:var(--q4-blue-600)!important;
}
.assessment-page .segmented{background:#ECEFF5}
.assessment-page .segment-btn.active{background:#fff;color:var(--q4-blue-600);box-shadow:0 4px 12px rgba(98,127,194,.07)}
.assessment-page .hero-card{
  background:linear-gradient(145deg,#FFFDF9,var(--q4-blue-050));
  border-color:rgba(98,127,194,.09);
}
.question-wrap{background:linear-gradient(180deg,#F9FAFD,#FBFAF7)}
.question-progress{background:#E8EBF2}
.question-progress i{background:linear-gradient(90deg,var(--q4-blue-500),var(--q4-blue-600))}
.question-option.selected{border-color:rgba(98,127,194,.45)!important;background:var(--q4-blue-050)!important;box-shadow:0 0 0 2px rgba(98,127,194,.06)}
.assessment-report-page .report-hero-card{
  background:
    radial-gradient(circle at 90% 8%,rgba(187,199,229,.24),transparent 31%),
    linear-gradient(145deg,#FFFDFB,#F1F5FB)!important;
  border-color:rgba(98,127,194,.10)!important;
}
.assessment-report-page .report-kicker{color:var(--q4-blue-600)}
.assessment-report-page .report-score{background:conic-gradient(var(--q4-blue-600) 0 72%,#E8EBF2 72% 100%)}
.assessment-report-page .dimension-bar{background:#E8EBF2}
.assessment-report-page .dimension-bar i{background:linear-gradient(90deg,#9FB0DA,var(--q4-blue-600))}
.assessment-report-page .personalized-insight{
  background:linear-gradient(145deg,var(--q4-violet-050),#FFFDF9);
  border-color:rgba(128,116,178,.09);
}
.assessment-report-page .personalized-insight .panel-title-icon{color:var(--q4-violet-600)}

/* ---------- Drawer: only high-level services use color; low-frequency navigation stays neutral ---------- */
.v35-membership{
  background:linear-gradient(135deg,#465640,#5C6B4C)!important;
  border-color:rgba(56,73,50,.08)!important;
  color:#FFF9EE!important;
}
.v35-membership small{color:#DDE5D8!important}
.v35-membership-link{color:#F4D89A!important}
.v35-membership-link svg{stroke:#F4D89A!important}
.v35-services>button{
  background:rgba(255,255,255,.72);
  border-color:rgba(74,85,69,.07);
  box-shadow:0 7px 20px rgba(48,58,44,.035);
}
.v35-services>button:nth-child(1)>span{background:var(--q4-green-100)!important;color:var(--q4-green-600)!important}
.v35-services>button:nth-child(2)>span{background:var(--q4-blue-100)!important;color:var(--q4-blue-600)!important}
.v35-services>button:nth-child(3)>span{background:var(--q4-peach-100)!important;color:var(--q4-peach-600)!important}
.v35-history-row.is-current{background:var(--q4-green-050)}

/* ---------- Restraint: color lives in icons/surfaces, not body text ---------- */
.v3-question-list b,.assessment-main h3,.growth-page .panel-title,.v35-services b,
.final-understanding p,.action-card p{color:var(--q4-text)}

@media(max-width:360px){
  .growth-hero-card .metric{padding:10px}
  .final-understanding>.insight-section{padding:10px 11px}
}

/* ======================================================================
   亲智聊 Design System 4.1 · Full App Visual Convergence
   将 V4.0 已确认的语义多色体系完整铺到剩余页面。
   原则：颜色承载语义，不改变路由、状态机和既有 UX。
   ====================================================================== */

:root{
  --q41-danger:#C96F60;
  --q41-danger-soft:#FFF0EC;
  --q41-slate:#758197;
  --q41-slate-soft:#F0F3F7;
  --q41-shadow:0 10px 28px rgba(52,63,47,.052);
  --q41-shadow-strong:0 16px 38px rgba(52,63,47,.075);
}

/* ---------- global secondary page polish ---------- */
.secondary-page{
  background:
    radial-gradient(circle at 92% 0%,rgba(168,197,152,.075),transparent 24%),
    linear-gradient(180deg,#F8F6F1 0%,#F5F3EF 100%);
}
.secondary-page .page-titlebar{
  background:rgba(250,248,243,.91);
  border-bottom-color:rgba(69,82,63,.055);
  box-shadow:0 1px 0 rgba(255,255,255,.62);
}
.secondary-page .page-titlebar b{font-weight:680;color:#333A31}
.secondary-page .right-action{color:var(--q4-green-600);font-weight:600}
.panel,.settings-group,.profile-list{
  border-color:rgba(73,87,66,.065);
  box-shadow:var(--q41-shadow);
}
.panel-title,.archive-title{letter-spacing:-.1px}

/* ---------- login chain: brand green + warm peach, same flow ---------- */
.auth-sheet-screen,.auth-center{
  background:
    radial-gradient(circle at 88% 10%,rgba(168,197,152,.18),transparent 26%),
    radial-gradient(circle at 5% 30%,rgba(231,160,110,.10),transparent 22%),
    linear-gradient(180deg,#F9F4EC,#FCFAF6 65%,#F6F2EB);
}
.auth-panel{
  background:rgba(252,250,246,.96);
  border-top:1px solid rgba(73,87,66,.06);
  box-shadow:0 -18px 42px rgba(59,70,54,.075);
}
.auth-visual{background:linear-gradient(160deg,rgba(242,247,239,.42),rgba(252,248,241,.55))}
.auth-panel h1,.auth-center h1{color:#30382E;font-weight:700;letter-spacing:-.3px}
.field{border-color:rgba(88,103,79,.10);background:rgba(255,255,255,.85);box-shadow:inset 0 1px 0 rgba(255,255,255,.75)}
.field:focus-within{border-color:rgba(94,143,75,.36);box-shadow:0 0 0 3px rgba(94,143,75,.07)}
.code-box{border-color:rgba(98,127,194,.16);background:rgba(255,255,255,.86)}
.code-box:focus{border-color:var(--q4-blue-500);box-shadow:0 0 0 3px rgba(98,127,194,.08)}
.resend-btn.ready{color:var(--q4-blue-600)}
.mask-phone{background:var(--q4-cream-050);border-color:rgba(175,148,94,.10);color:#4E493E}
.permission-card{background:var(--q4-blue-050)!important;border-color:rgba(98,127,194,.09)!important}
.check-box:checked{background:var(--q4-green-600);border-color:var(--q4-green-600)}
.agreement-row a{color:var(--q4-green-600)}
.success-screen{background:linear-gradient(160deg,#F7F3EC,#F0F6EC)}
.success-icon{background:var(--q4-green-100);color:var(--q4-green-600)}
.spinner{border-color:#E8E3DA;border-top-color:var(--q4-green-600)}

/* ---------- profile & editors ---------- */
.profile-page{
  background:
    radial-gradient(circle at 90% 3%,rgba(240,197,164,.12),transparent 24%),
    linear-gradient(180deg,#F8F5F0,#F4F3EE);
}
.profile-list-row:nth-child(1) .profile-list-value{color:var(--q4-peach-600)}
.profile-list-row:nth-child(2) .profile-list-value{color:var(--q4-blue-600)}
.profile-list-row:nth-child(3) .profile-list-value{color:var(--q4-green-600)}
.profile-list-row>span:first-child{color:#3F473D}
.profile-footnote{color:#8F978D}
.profile-avatar-small{box-shadow:0 8px 20px rgba(91,71,49,.11)}
.profile-list-row:active{background:rgba(98,127,194,.04)}
.role-editor-option.selected{background:var(--q4-green-050);color:var(--q4-green-600)}
.avatar-crop-frame{background:linear-gradient(145deg,#D7D9D1,#C9CEC5);box-shadow:0 16px 36px rgba(48,58,44,.14)}
.avatar-zoom-row input{accent-color:var(--q4-green-600)}

/* ---------- family archive: each type gets a soft identity ---------- */
.archive-page{
  background:
    radial-gradient(circle at 92% 1%,rgba(168,197,152,.18),transparent 27%),
    radial-gradient(circle at 4% 29%,rgba(187,199,229,.08),transparent 20%),
    linear-gradient(180deg,#F6F7F1,#F5F3EE);
}
.archive-page .segmented{background:#E9EFE5}
.archive-page .segment-btn.active{color:var(--q4-green-600)}
.archive-page .member-card{position:relative}
.archive-page .member-avatar{background:var(--q4-green-100);color:var(--q4-green-600)}
.archive-page .edit-pill{background:var(--q4-cream-100);color:#8C7446}
.archive-page .panel:nth-of-type(2) .archive-title{color:var(--q4-blue-600)}
.archive-page .panel:nth-of-type(3) .archive-title{color:var(--q4-violet-600)}
.archive-page .ability-row{position:relative;padding-left:1px}
.archive-page .ability-row b{color:#3F493D}
.archive-page .ability-row p{color:#778275}
.archive-four button{min-height:58px;border-radius:16px;background:#fff;border:1px solid transparent;box-shadow:0 7px 18px rgba(55,67,50,.035);font-weight:600}
.archive-four button:nth-child(1){background:var(--q4-green-050);border-color:rgba(94,143,75,.08);color:var(--q4-green-600)}
.archive-four button:nth-child(2){background:var(--q4-blue-050);border-color:rgba(98,127,194,.08);color:var(--q4-blue-600)}
.archive-four button:nth-child(3){background:var(--q4-peach-050);border-color:rgba(216,134,82,.08);color:var(--q4-peach-600)}
.archive-four button:nth-child(4){background:var(--q4-violet-050);border-color:rgba(128,116,178,.08);color:var(--q4-violet-600)}
.memory-page .panel:first-child{background:linear-gradient(145deg,#FFFDF9,var(--q4-violet-050));border-color:rgba(128,116,178,.08)}
.memory-page .panel-title{color:var(--q4-violet-600)}
.memory-page .switch.on{background:var(--q4-violet-500)}
.members-page .panel:first-child .list-row:nth-child(1) .list-row-icon{background:var(--q4-peach-100);color:var(--q4-peach-600)}
.members-page .panel:first-child .list-row:nth-child(2) .list-row-icon{background:var(--q4-green-100);color:var(--q4-green-600)}
.archive-basic-page .panel{background:linear-gradient(145deg,#FFFDF9,var(--q4-blue-050));border-color:rgba(98,127,194,.08)}
.archive-basic-page .panel-title{color:var(--q4-blue-600)}

/* ---------- guide family: editorial warmth ---------- */
.guide-page,.guide-category-page,.guide-detail-page{
  background:
    radial-gradient(circle at 92% 2%,rgba(234,217,175,.19),transparent 28%),
    linear-gradient(180deg,#F9F5ED,#F5F2EC);
}
.guide-category-panel{background:rgba(255,255,255,.72)}
.category-btn.tone-green{background:var(--q4-green-050)}
.category-btn.tone-blue{background:var(--q4-blue-050)}
.category-btn.tone-peach{background:var(--q4-peach-050)}
.category-btn.tone-lilac{background:var(--q4-violet-050)}
.category-btn.tone-sand{background:var(--q4-cream-050)}
.guide-card.tone-green .guide-cover{background:linear-gradient(135deg,var(--q4-green-100),#FFF9ED)}
.guide-card.tone-blue .guide-cover{background:linear-gradient(135deg,var(--q4-blue-100),#FFF9ED)}
.guide-card.tone-peach .guide-cover{background:linear-gradient(135deg,var(--q4-peach-100),#FFF8F0)}
.guide-card.tone-lilac .guide-cover{background:linear-gradient(135deg,var(--q4-violet-100),#FFF8F0)}
.guide-card.tone-sand .guide-cover{background:linear-gradient(135deg,var(--q4-cream-100),#FFF9F0)}
.guide-detail-page .article-progress i{background:linear-gradient(90deg,var(--q4-peach-500),var(--q4-green-500))}
.guide-detail-page .article-body{background:linear-gradient(180deg,#FCFAF6,#FFFCF8)}
.guide-detail-page .article-quote{background:var(--q4-cream-050);border-left-color:var(--q4-cream-600);color:#5E5542}
.guide-detail-page .article-body h2:nth-of-type(1){color:var(--q4-peach-600)}
.guide-detail-page .article-body h2:nth-of-type(2){color:var(--q4-blue-600)}
.guide-detail-page .article-body h2:nth-of-type(3){color:var(--q4-green-600)}

/* ---------- membership: olive + warm gold, no ecommerce red ---------- */
.membership-page{
  background:
    radial-gradient(circle at 85% 0%,rgba(234,217,175,.24),transparent 27%),
    linear-gradient(180deg,#F7F4EB,#F3F2EC);
}
.membership-page .member-banner{
  background:
    radial-gradient(circle at 100% 0%,rgba(244,216,154,.15),transparent 34%),
    linear-gradient(135deg,#384A36 0%,#4D6044 58%,#677253 100%);
}
.membership-page .section-title{color:#4A523F}
.membership-page .benefit-card:nth-child(1)>span{background:var(--q4-violet-100);color:var(--q4-violet-600)}
.membership-page .benefit-card:nth-child(2)>span{background:var(--q4-blue-100);color:var(--q4-blue-600)}
.membership-page .benefit-card:nth-child(3)>span{background:var(--q4-peach-100);color:var(--q4-peach-600)}
.membership-page .benefit-card:nth-child(4)>span{background:var(--q4-green-100);color:var(--q4-green-600)}
.membership-page .benefit-card:nth-child(5)>span{background:var(--q4-cream-100);color:#8B7447}
.membership-page .benefit-card:nth-child(6)>span{background:var(--q4-violet-100);color:var(--q4-violet-600)}
.membership-plans-page .plan-card.selected{border-color:rgba(175,148,94,.40);background:linear-gradient(145deg,#FFFCF6,var(--q4-cream-050));box-shadow:0 0 0 3px rgba(175,148,94,.07)}
.membership-plans-page .plan-card .recommend{background:#887246}
.membership-plans-page .plan-card strong{color:#796538}
.orders-page .order-row span:last-child{color:var(--q4-green-600);font-weight:600}

/* ---------- task center: action peach + assessment blue ---------- */
.task-page{
  background:
    radial-gradient(circle at 90% 1%,rgba(240,197,164,.20),transparent 27%),
    linear-gradient(180deg,#FAF6F0,#F5F3EE);
}
.task-page .segmented{background:#F0EAE3}
.task-page .segment-btn.active{color:var(--q4-peach-600)}
.task-page .panel:first-of-type .list-row-icon{background:var(--q4-peach-100);color:var(--q4-peach-600)}
.task-page .panel:first-of-type .list-row:nth-child(even) .list-row-icon{background:var(--q4-blue-100);color:var(--q4-blue-600)}
.task-page .latest-action{background:linear-gradient(145deg,var(--q4-cream-050),#FFFDF9);border-color:rgba(175,148,94,.09)}
.task-page .latest-action .inline-main{background:linear-gradient(135deg,var(--q4-peach-500),var(--q4-peach-600))}
.task-page .task-pill{background:var(--q4-peach-100);color:var(--q4-peach-600)}

/* ---------- messages: quieter than tasks, category accents only ---------- */
.messages-page{background:linear-gradient(180deg,#F7F7F4,#F4F3EF)}
.messages-page .message-panel{background:rgba(255,255,255,.78)}
.messages-page .inbox-message:nth-child(1) .message-icon{background:var(--q4-peach-100);color:var(--q4-peach-600)}
.messages-page .inbox-message:nth-child(2) .message-icon{background:var(--q4-green-100);color:var(--q4-green-600)}
.messages-page .inbox-message:nth-child(3) .message-icon{background:var(--q4-blue-100);color:var(--q4-blue-600)}
.messages-page .message-unread-dot{background:var(--q4-peach-500)!important}
.messages-page .inbox-message.is-read{opacity:.70}
.messages-page .inbox-message.is-unread{background:linear-gradient(90deg,rgba(255,255,255,0),rgba(244,246,251,.42))}

/* ---------- settings family: restrained; color only at high-level icons ---------- */
.settings-page{background:linear-gradient(180deg,#F7F5F1,#F3F2EE)}
.settings-page .settings-group{background:rgba(255,255,255,.78)}
.settings-page>.page-body>.settings-group:first-child .list-row:nth-child(1) .list-row-icon{background:var(--q4-blue-100);color:var(--q4-blue-600)}
.settings-page>.page-body>.settings-group:first-child .list-row:nth-child(2) .list-row-icon{background:var(--q4-peach-100);color:var(--q4-peach-600)}
.settings-page>.page-body>.settings-group:first-child .list-row:nth-child(3) .list-row-icon{background:var(--q4-green-100);color:var(--q4-green-600)}
.settings-page>.page-body>.settings-group:nth-child(2) .list-row:nth-child(1) .list-row-icon{background:var(--q4-cream-100);color:#8B7447}
.settings-page>.page-body>.settings-group:nth-child(2) .list-row:nth-child(2) .list-row-icon{background:var(--q4-violet-100);color:var(--q4-violet-600)}
.privacy-page .hero-card{background:linear-gradient(145deg,var(--q4-green-050),#FFFDF9);border-color:rgba(94,143,75,.08)}
.privacy-page .hero-card h1{color:var(--q4-green-600)}
.privacy-page .settings-group .list-row:nth-child(1) .list-row-icon{background:var(--q4-green-100);color:var(--q4-green-600)}
.privacy-page .settings-group .list-row:nth-child(2) .list-row-icon{background:var(--q4-violet-100);color:var(--q4-violet-600)}
.notification-settings-page .switch.on{background:var(--q4-green-500)}
.help-page .search-box:focus-within{border-color:rgba(98,127,194,.28);box-shadow:0 0 0 3px rgba(98,127,194,.055)}
.help-page .list-row-icon{background:var(--q4-blue-100);color:var(--q4-blue-600)}
.about-page .empty-card{background:linear-gradient(145deg,#FFFDF9,var(--q4-cream-050));border-radius:22px}
.about-page .settings-group .list-row:nth-child(1) .list-row-icon{background:var(--q4-cream-100);color:#8B7447}
.about-page .settings-group .list-row:nth-child(2) .list-row-icon{background:var(--q4-green-100);color:var(--q4-green-600)}
.about-page .settings-group .list-row:nth-child(3) .list-row-icon{background:var(--q4-blue-100);color:var(--q4-blue-600)}
.about-page .settings-group .list-row:nth-child(4) .list-row-icon{background:var(--q4-violet-100);color:var(--q4-violet-600)}
.danger-btn{background:var(--q41-danger-soft);color:var(--q41-danger)}

/* ---------- feedback: calm utility page with blue selection + peach submit accent ---------- */
.feedback-page{background:linear-gradient(180deg,#F7F6F2,#F3F2EE)!important}
.feedback-page .subtle{background:transparent!important;color:#8A9188!important}
.feedback-page .feedback-list,.feedback-page .feedback-block{background:rgba(255,255,255,.78)}
.feedback-page .feedback-item.selected{background:var(--q4-blue-050)}
.feedback-page .feedback-item.selected .radio{border-color:var(--q4-blue-600)}
.feedback-page .feedback-item.selected .radio:after{background:var(--q4-blue-600)}
.feedback-page .feedback-label{background:#F0EFEB;color:#687166}
.feedback-page .upload-add{background:var(--q4-blue-050);border-color:rgba(98,127,194,.10);color:var(--q4-blue-600)}
.feedback-page .feedback-submit .primary-btn:not(:disabled){background:linear-gradient(135deg,var(--q4-peach-500),var(--q4-peach-600));box-shadow:0 8px 18px rgba(216,134,82,.14)}

/* ---------- growth child pages & history ---------- */
.growth-weekly-page .hero-card{background:linear-gradient(145deg,var(--q4-green-050),var(--q4-cream-050));border-color:rgba(94,143,75,.08)}
.growth-weekly-page .panel:nth-of-type(1) .panel-title{color:var(--q4-blue-600)}
.growth-weekly-page .panel:nth-of-type(2) .panel-title{color:var(--q4-peach-600)}
.action-detail-page .hero-card{background:linear-gradient(145deg,var(--q4-cream-050),#FFFDF9);border-color:rgba(175,148,94,.09)}
.action-detail-page .panel .ability-row:nth-child(2) b{color:var(--q4-green-600)}
.action-detail-page .panel .ability-row:nth-child(3) b{color:var(--q4-peach-600)}
.action-detail-page .panel .ability-row:nth-child(4) b{color:var(--q4-blue-600)}
.action-history-page .segmented{background:#ECEFE8}
.action-history-page .segment-btn.active{color:var(--q4-green-600)}
.action-history-page .growth-record-result.status-pending{background:var(--q4-peach-100);color:var(--q4-peach-600)}
.action-history-page .growth-record-result.status-better{background:var(--q4-green-100);color:var(--q4-green-600)}
.action-history-page .growth-record-result.status-same{background:var(--q4-blue-100);color:#6F7F9E}
.action-history-page .growth-record-result.status-worse{background:#FBE7E1;color:#B86A59}

/* ---------- sheets / overlays / empty / loading / toast ---------- */
.sheet-layer{background:rgba(42,46,39,.36);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.bottom-sheet{background:rgba(252,250,246,.98);border-top:1px solid rgba(78,91,71,.07);box-shadow:0 -22px 50px rgba(41,48,37,.15)}
.sheet-handle{background:#C9CEC5}
.bottom-sheet h2{color:#333A31;font-weight:690}
.sheet-option{border-color:rgba(77,91,70,.075);background:rgba(255,255,255,.80);box-shadow:0 5px 14px rgba(52,62,47,.028)}
.sheet-option:active{background:var(--q4-green-050)}
.sheet-option:nth-of-type(2) svg{color:var(--q4-blue-600)}
.sheet-option:nth-of-type(3) svg{color:var(--q4-peach-600)}
.sheet-option:nth-of-type(4) svg{color:var(--q4-violet-600)}
.empty-card{border-radius:22px;background:linear-gradient(145deg,rgba(255,255,255,.82),rgba(249,247,241,.82));border:1px solid rgba(75,89,68,.055)}
.skeleton{background:linear-gradient(90deg,#ECEBE6 25%,#F7F6F2 50%,#ECEBE6 75%);background-size:200% 100%;animation:skeletonMove 1.5s linear infinite}
@keyframes skeletonMove{from{background-position:200% 0}to{background-position:-200% 0}}
.toast{background:rgba(45,52,42,.92)!important;color:#fff!important;box-shadow:0 12px 30px rgba(37,44,34,.18)!important;backdrop-filter:blur(10px)}
.network-banner{background:linear-gradient(90deg,#6D7891,#59657E)!important}

/* ---------- top-level buttons inherit semantics without turning rainbow ---------- */
.primary-btn{background:linear-gradient(135deg,var(--q4-green-500),var(--q4-green-600));box-shadow:0 8px 18px rgba(94,143,75,.15);font-weight:650}
.secondary-btn{border-color:rgba(94,143,75,.18);color:var(--q4-green-600);font-weight:600}
.text-btn{color:var(--q4-green-600);font-weight:600}

/* ---------- desktop/mobile containment ---------- */
@media(max-width:360px){
  .benefit-grid{gap:8px}
  .benefit-card{padding:12px}
  .archive-four button{font-size:10.5px}
  .v35-services b{font-size:12.5px}
}

/* ======================================================================
   亲智聊 Design System 4.2 · Warm Beige Editorial
   核心：米色是环境，白色是内容，橙色是动作，绿色是品牌；
         蓝/紫只承担专业与深度理解标记，不再形成大面积彩色表面。
   ====================================================================== */
:root{
  --q42-canvas:#F3EADE;
  --q42-canvas-soft:#F8F2EA;
  --q42-surface:#FDF9F3;
  --q42-surface-strong:#FFFFFF;
  --q42-surface-muted:#F6EEE4;
  --q42-text:#302B27;
  --q42-text-2:#766D64;
  --q42-text-3:#A0978E;
  --q42-line:#E8D9C8;
  --q42-line-soft:#EFE4D8;
  --q42-orange:#E88D42;
  --q42-orange-2:#F29A52;
  --q42-orange-soft:#FDE9D6;
  --q42-green:#739B5A;
  --q42-green-soft:#EAF0E4;
  --q42-blue:#6F86BE;
  --q42-blue-soft:#EEF2F8;
  --q42-violet:#8A7EB1;
  --q42-violet-soft:#F1EEF7;
  --q42-cream:#B49460;
  --q42-cream-soft:#F7EEDC;

  /* Retune existing aliases so legacy components inherit the warmer system. */
  --bg:var(--q42-canvas);
  --bg-soft:var(--q42-canvas-soft);
  --surface:var(--q42-surface);
  --surface-2:#FBF5ED;
  --surface-3:var(--q42-surface-muted);
  --text:var(--q42-text);
  --muted:var(--q42-text-2);
  --muted-2:var(--q42-text-3);
  --line:var(--q42-line);
  --line-soft:var(--q42-line-soft);
  --orange:var(--q42-orange);
  --orange-2:var(--q42-orange-2);
  --orange-soft:var(--q42-orange-soft);
  --green:var(--q42-green);
  --green-soft:var(--q42-green-soft);
  --blue:var(--q42-blue);
  --blue-soft:var(--q42-blue-soft);
  --violet:var(--q42-violet);
  --violet-soft:var(--q42-violet-soft);

  /* Make semantic soft surfaces nearly neutral; color becomes a marker, not a fill. */
  --q4-canvas:var(--q42-canvas);
  --q4-surface:var(--q42-surface);
  --q4-surface-2:var(--q42-surface-muted);
  --q4-text:var(--q42-text);
  --q4-text-2:var(--q42-text-2);
  --q4-text-3:var(--q42-text-3);
  --q4-divider:var(--q42-line-soft);
  --q4-green-600:var(--q42-green);
  --q4-green-500:#87A86F;
  --q4-green-300:#B9CBAA;
  --q4-green-100:#EFF3EB;
  --q4-green-050:#FAFBF8;
  --q4-peach-600:#D98751;
  --q4-peach-500:#E5A06E;
  --q4-peach-300:#F0C9A9;
  --q4-peach-100:#FAEDE1;
  --q4-peach-050:#FEFAF6;
  --q4-blue-600:var(--q42-blue);
  --q4-blue-500:#8799C4;
  --q4-blue-300:#C5CEE1;
  --q4-blue-100:#F0F3F8;
  --q4-blue-050:#FBFCFD;
  --q4-violet-600:var(--q42-violet);
  --q4-violet-500:#9C91BE;
  --q4-violet-300:#CEC8DE;
  --q4-violet-100:#F3F0F7;
  --q4-violet-050:#FCFBFD;
  --q4-cream-600:var(--q42-cream);
  --q4-cream-500:#CFB17D;
  --q4-cream-300:#E5D4B4;
  --q4-cream-100:#F7EFDF;
  --q4-cream-050:#FEFBF5;
}

html,body{
  background:linear-gradient(180deg,#EFE4D7 0%,#F5EDE3 100%)!important;
  color:var(--q42-text)!important;
}
.app-frame,.main-viewport,.screen-host,.screen{
  background:var(--q42-canvas-soft)!important;
}
.statusbar{color:var(--q42-text)!important}
.topbar,.page-titlebar{
  background:rgba(253,249,243,.96)!important;
  border-color:rgba(149,116,82,.10)!important;
  color:var(--q42-text)!important;
}
.page-titlebar .right-action{color:var(--q42-orange)!important}

/* Warm neutral surfaces throughout the app. */
.card,.panel,.settings-group,.message-panel,.assessment-card,.guide-card,.member-card,.empty-card,
.v3-question-list,.v35-service-card,.v35-member-strip,.v35-support-link,.action-record-list,
.profile-list,.inbox-panel,.benefit-card,.plan-card,.order-card{
  background:rgba(255,253,249,.94)!important;
  border-color:rgba(151,117,83,.10)!important;
  box-shadow:0 7px 20px rgba(92,67,43,.045)!important;
}
.secondary-page,.growth-page,.assessment-page,.profile-page,.archive-page,.memory-page,.members-page,
.archive-basic-page,.guide-page,.guide-category-page,.guide-detail-page,.membership-page,
.membership-plans-page,.orders-page,.task-page,.messages-page,.settings-page,.privacy-page,
.notification-settings-page,.help-page,.about-page,.feedback-page,.weekly-page,.action-history-page{
  background:
    radial-gradient(circle at 92% 3%,rgba(234,208,177,.12),transparent 26%),
    linear-gradient(180deg,#F8F2EA 0%,#F4ECE2 100%)!important;
}
.page-body{color:var(--q42-text)}

/* Primary action is orange; green identifies the brand/growth rather than every action. */
.primary-btn,.inline-main,.full-btn.primary-btn{
  background:linear-gradient(135deg,var(--q42-orange-2),var(--q42-orange))!important;
  color:#fff!important;
  box-shadow:0 9px 18px rgba(232,141,66,.16)!important;
}
.secondary-btn{background:#FFFDF9!important;border-color:#E9C9AC!important;color:#C7773F!important}
.small-cta{background:var(--q42-orange-soft)!important;color:#C6753C!important}
.badge{background:var(--q42-orange)!important}

/* ---------- Home: warm scene, white chips, tiny semantic icon cues ---------- */
.ai-shell{
  background:linear-gradient(160deg,#FAF4EB 0%,#F7EFE5 58%,#FBF6EF 100%)!important;
}
.v3-home-stage{background:#F6E9D8!important;border-bottom-color:rgba(151,117,83,.08)!important}
.v3-home-stage-bg{filter:saturate(.62) sepia(.08) brightness(1.055);opacity:.72!important}
.v3-home-stage:after{
  content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,rgba(250,241,228,.55) 0%,rgba(250,241,228,.18) 52%,rgba(251,244,234,.28) 100%);
}
.v3-home-copy,.v3-home-mascot,.v3-home-prompts{z-index:3}
.v3-home-copy h1{color:#302C27!important}.v3-home-copy p{color:#786F65!important}
.v3-home-mascot{filter:drop-shadow(0 12px 18px rgba(82,69,48,.10)) saturate(.88)!important}
.v3-home-chip{
  background:rgba(255,253,249,.92)!important;
  border-color:rgba(151,117,83,.10)!important;
  color:#625A52!important;
  box-shadow:0 7px 18px rgba(91,67,45,.05)!important;
}
.v3-home-chip:nth-child(1) span{background:#EFF3EB!important;color:var(--q42-green)!important}
.v3-home-chip:nth-child(2) span{background:#FCEDE1!important;color:#D78350!important}
.v3-home-chip:nth-child(3) span{background:#EFF2F8!important;color:var(--q42-blue)!important}
.v3-home-chip:nth-child(4) span{background:#F7EFDF!important;color:#9C8054!important}
.v3-home-content,.v3-question-section{background:transparent!important}
.v3-growth-summary{
  background:rgba(255,253,249,.96)!important;
  border-color:rgba(151,117,83,.10)!important;
  box-shadow:0 12px 28px rgba(91,67,45,.055)!important;
}
.v3-growth-summary:before{background:rgba(185,203,170,.14)!important}
.v3-growth-summary .growth-icon,.v3-growth-deco{background:#F1F4ED!important;color:var(--q42-green)!important}
.v3-growth-summary .growth-stat{background:#FFFDFC!important;border-color:rgba(151,117,83,.08)!important}
.v3-growth-summary .growth-stat:nth-child(1),.v3-growth-summary .growth-stat:nth-child(2){background:#FFFDFC!important}
.v3-question-list{background:rgba(255,253,249,.94)!important;border-color:rgba(151,117,83,.09)!important}
.v3-question-list>button{border-bottom-color:rgba(151,117,83,.07)!important}

/* ---------- Conversation / interpretation: one warm white card, color only as rails ---------- */
.chat-area,.v36-conversation-section{background:transparent!important}
.chat-message.ai{background:#FFFDF9!important;border-color:rgba(151,117,83,.08)!important;color:#4D4640!important}
.chat-message.user{background:#F3EEE7!important;color:#403A35!important}
.choice-chip{background:#FFFDF9!important;border-color:#E7D8C7!important;color:#625A52!important}
.choice-chip:active,.choice-chip.selected{background:#FDEFE1!important;border-color:#EDBE97!important;color:#B86D38!important}
.interpretation-card{
  background:#FFFDF9!important;
  border-color:rgba(151,117,83,.11)!important;
  box-shadow:0 14px 30px rgba(91,67,45,.055)!important;
}
.interpret-head .interpret-mark{background:#F3F0F7!important;color:var(--q42-violet)!important}
.progress-rail{background:#EFE7DE!important}
.progress-rail i{background:linear-gradient(90deg,#B9A47D 0%,#D39A67 100%)!important}
.progress-labels span.current{color:#B7723D!important}
.final-title{background:#FCF7EF!important;border-color:rgba(180,148,96,.12)!important}
.final-understanding>.insight-section{
  background:#FFFDF9!important;
  border:1px solid rgba(151,117,83,.09)!important;
  color:#504942!important;
}
.final-understanding>.event-tone:before{background:var(--q42-blue)!important}
.final-understanding>.child-tone:before{background:var(--q42-green)!important}
.final-understanding>.parent-tone:before{background:#D98751!important}
.final-understanding>.event-tone small{color:var(--q42-blue)!important}
.final-understanding>.child-tone small{color:var(--q42-green)!important}
.final-understanding>.parent-tone small{color:#D98751!important}
.relationship-loop{
  background:#FFFDF9!important;
  border:1px solid rgba(151,117,83,.09)!important;
  box-shadow:inset 3px 0 0 var(--q42-violet)!important;
  color:#5B534D!important;
}
.relationship-loop span{background:#F7F3EE!important;color:#635B55!important}
.insight-conclusion{background:#FCF8F0!important;border-color:rgba(180,148,96,.12)!important;color:#4C463C!important}

/* Action card: warm neutral body, orange action signal. */
.action-card{
  background:#FFF9EF!important;
  border-color:rgba(211,155,101,.17)!important;
  box-shadow:0 14px 30px rgba(106,76,45,.055)!important;
}
.action-mark{background:#FCE9D8!important;color:var(--q42-orange)!important}
.action-head small{color:#B87543!important}.action-head h3{color:#453C34!important}
.phrase-box{background:#FFFDF9!important;border-color:rgba(180,148,96,.12)!important}
.action-reason{background:#F8F5EF!important;border-color:rgba(151,117,83,.08)!important}
.action-reason>span{color:var(--q42-green)!important}
.action-buttons .inline-main{background:linear-gradient(135deg,var(--q42-orange-2),var(--q42-orange))!important}

/* ---------- Growth: beige-first, status colors only at icon/text level ---------- */
.growth-page{background:linear-gradient(180deg,#F7F0E7,#F3EADF)!important}
.growth-hero-card{
  background:#FFFDF9!important;
  border-color:rgba(151,117,83,.10)!important;
  box-shadow:0 10px 26px rgba(91,67,45,.05)!important;
}
.growth-hero-card .metric{
  background:#FFFDFC!important;
  border:1px solid rgba(151,117,83,.075)!important;
}
.growth-hero-card .metric:nth-child(1) strong{color:var(--q42-blue)!important}
.growth-hero-card .metric:nth-child(2) strong{color:var(--q42-orange)!important}
.growth-hero-card .metric:nth-child(3) strong{color:var(--q42-green)!important}
.growth-hero-card .metric:nth-child(4) strong{color:#A18454!important}
.growth-page .day.selected{background:#FBE9D7!important;box-shadow:inset 0 0 0 1px rgba(232,141,66,.12)!important}
.growth-page .day.marked{background:#FBF6EF!important}
.growth-page .latest-action{background:#FFFDF9!important;border-color:rgba(151,117,83,.10)!important}
.growth-page .latest-action-title>span{background:#FCE9D8!important;color:var(--q42-orange)!important}
.action-record-list,.growth-record-row{background:#FFFDF9!important}

/* ---------- Assessment: warm page, blue only for professional markers ---------- */
.assessment-page{background:linear-gradient(180deg,#F8F2EA,#F4ECE2)!important}
.assessment-page .page-titlebar{background:rgba(253,249,243,.96)!important}
.assessment-card{background:#FFFDF9!important;border-color:rgba(151,117,83,.09)!important}
.assessment-icon{background:#EFF2F8!important;color:var(--q42-blue)!important}
.assessment-page .progress-bar i,.assessment-page .question-progress i,.assessment-page .dimension-bar i{background:var(--q42-blue)!important}
.assessment-page .small-cta{background:#EEF2F8!important;color:var(--q42-blue)!important}
.assessment-page .segment-btn.active{color:var(--q42-blue)!important;background:#FFFDF9!important}
.question-wrap{background:var(--q42-canvas-soft)!important}
.question-option{background:#FFFDF9!important;border-color:#E6D7C6!important}
.question-option.selected{background:#F4F6FA!important;border-color:#BAC7DF!important}

/* ---------- Drawer / profile: warm neutral shell; only 3 service icons carry color ---------- */
.drawer{background:#F8F2E9!important;box-shadow:18px 0 42px rgba(75,55,37,.16)!important}
.v35-account-bar{background:rgba(248,242,233,.96)!important;border-color:rgba(151,117,83,.08)!important}
.v35-drawer-scroll{background:transparent!important}
.v35-member-strip,.v35-services,.v35-support-link{background:#FFFDF9!important;border-color:rgba(151,117,83,.09)!important}
.v35-services .v35-service:nth-child(1) .v35-service-icon,.v3-drawer-services .drawer-service:nth-child(1)>span{background:#EFF3EB!important;color:var(--q42-green)!important}
.v35-services .v35-service:nth-child(2) .v35-service-icon,.v3-drawer-services .drawer-service:nth-child(2)>span{background:#EEF2F8!important;color:var(--q42-blue)!important}
.v35-services .v35-service:nth-child(3) .v35-service-icon,.v3-drawer-services .drawer-service:nth-child(3)>span{background:#FCEDE1!important;color:#D98751!important}
.v35-drawer-history .history-row,.v3-drawer-history .history-row{border-color:rgba(151,117,83,.07)!important;color:#534C45!important}
.v35-account-action .v35-account-icon,.v35-account-close{background:#FFFDF9!important;color:#625A52!important;border-color:rgba(151,117,83,.08)!important}
.profile-page{background:linear-gradient(180deg,#F8F2EA,#F4ECE2)!important}
.profile-list-row .profile-list-value{color:#756C64!important}
.role-editor-option.selected{background:#FDEFE2!important;color:#B86D38!important}
.avatar-zoom-row input{accent-color:var(--q42-orange)!important}

/* ---------- Archive: all content surfaces neutral; semantic colors become text/icon hints ---------- */
.archive-page,.memory-page,.members-page,.archive-basic-page{background:linear-gradient(180deg,#F8F2EA,#F4ECE2)!important}
.archive-page .segmented{background:#EEE6DC!important}.archive-page .segment-btn.active{color:#B66F3A!important;background:#FFFDF9!important}

.section-title button{font-size:14px!important;line-height:20px!important;padding:8px 2px!important}
.panel-title,.archive-title{font-size:var(--font-card-title)!important;line-height:26px!important}
.subtle{font-size:var(--font-support)!important;line-height:1.6!important}
.hero-card h1{font-size:var(--font-page-title)!important;line-height:32px!important}
.hero-card p{font-size:var(--font-body)!important;line-height:1.65!important}
.panel{padding:18px!important;border-radius:22px!important}
.page-body{padding:18px 18px calc(32px + var(--safe-bottom))!important}

/* Home hero: larger, bolder, fewer things per screen rather than smaller type. */
.v3-home-stage{height:382px!important}
.v3-home-copy{left:28px!important;top:58px!important}
.v3-home-copy h1{font-size:var(--font-display)!important;line-height:40px!important;font-weight:700!important;letter-spacing:-.7px!important}
.v3-home-copy p{font-size:var(--font-body-large)!important;line-height:26px!important;margin-top:8px!important;font-weight:400!important;color:#6A625B!important}
.v3-home-mascot{width:286px!important;right:-7px!important;bottom:38px!important;image-rendering:auto!important}
.v3-home-prompts{left:18px!important;right:18px!important;bottom:18px!important;gap:10px!important}
.v3-home-chip{height:48px!important;border-radius:24px!important;padding:0 10px!important;gap:8px!important;font-size:15px!important;line-height:20px!important;font-weight:500!important}
.v3-home-chip span{width:24px!important;height:24px!important;border-radius:8px!important;flex:0 0 24px!important}
.v3-home-chip svg{width:15px!important;height:15px!important;stroke-width:1.9!important}

/* Home growth card */
.v3-home-content{padding-top:7px!important}
.v3-growth-summary{padding:20px 19px 18px!important;border-radius:24px!important}
.v3-growth-summary .growth-row{gap:14px!important}
.v3-growth-summary .growth-icon{width:56px!important;height:56px!important;border-radius:18px!important}
.v3-growth-summary .growth-icon svg{width:27px!important;height:27px!important}
.v3-growth-summary .card-kicker{font-size:14px!important;line-height:20px!important;font-weight:500!important}
.v3-growth-summary .growth-main b{font-size:18px!important;line-height:26px!important;max-width:250px!important;margin-top:2px!important}
.v3-growth-summary .growth-main>span:not(.card-kicker){font-size:14px!important;line-height:21px!important;color:#7A7169!important}
.v3-growth-summary .growth-stats{gap:10px!important;margin-top:16px!important}
.v3-growth-summary .growth-stat{padding:13px 14px!important;border-radius:16px!important}

.v3-growth-summary .growth-stat strong em{font-size:13px!important;margin-left:3px!important}

/* Question list */
.v3-question-list{padding:4px 16px!important;border-radius:22px!important}
.v3-question-list>button{min-height:78px!important;gap:14px!important;padding:10px 0!important}
.v3-question-icon{width:44px!important;height:44px!important;border-radius:14px!important}
.v3-question-icon svg{width:22px!important;height:22px!important;stroke-width:1.9!important}
.v3-question-list b{font-size:17px!important;line-height:24px!important}

.home-or{font-size:14px!important;line-height:21px!important;margin-top:16px!important}

/* Composer: iOS-safe text size, 56+ px tactile target. */
.composer{padding:8px 12px calc(10px + var(--safe-bottom))!important}
.composer-row{min-height:60px!important;border-radius:30px!important;padding:5px 7px!important;gap:7px!important}

/* Chat: reading is the core task, so it gets body-large scale. */

.chat-date{font-size:13px!important;line-height:18px!important;margin:5px 0 15px!important}
.message-line{gap:9px!important;margin:12px 0!important}

.invite-card,.interpretation-card,.action-card{margin-left:47px!important;border-radius:22px!important}

.inline-main,.inline-alt{font-size:15px!important;min-height:44px!important;padding:0 15px!important;border-radius:16px!important}
.interpretation-card{padding:19px!important}
.interpret-head b{font-size:18px!important;line-height:26px!important}
.interpret-head small{font-size:13px!important;line-height:18px!important}
.interpret-mark{width:42px!important;height:42px!important;border-radius:14px!important}
.progress-labels span{font-size:13px!important;line-height:18px!important}
.understanding-box{font-size:16px!important;line-height:1.7!important;padding:15px!important}
.final-title{font-size:18px!important;line-height:26px!important}
.insight-section{padding:14px 15px!important}
.insight-section small{font-size:13px!important;line-height:18px!important}

.relationship-loop{font-size:14px!important;line-height:21px!important;padding:13px 11px!important}
.insight-conclusion{font-size:16px!important;line-height:1.68!important;padding:14px 15px!important}
.action-card{padding:19px!important}

.action-kicker{font-size:13px!important;line-height:18px!important}

.back-to-latest{height:42px!important;border-radius:21px!important;font-size:14px!important;padding:0 14px!important;bottom:88px!important}

.v43-services button>span{width:42px!important;height:42px!important}
.v43-services button svg{width:23px!important;height:23px!important;stroke-width:1.9!important}

  .section{padding-left:12px!important;padding-right:12px!important}
